    <title>Local Font Site</title>
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* 1. Define the local font */
        @font-face {
            font-family: 'RoutedGothic_halfItalic';
            /* Point directly to the file name in your repo */
            src: url('fonts/RoutedGothic_halfItalic.woff2') format('woff2'); 
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        /* 2. Apply the font to the page */
        body {
            font-family: 'RoutedGothic_halfItalic', sans-serif;
            background-color: #FFFFFF;
            color: #231F20FF;
            max-width: 600px;
            margin: 60px auto;
            padding: 20px;
            font-size: 1.2rem;
            line-height: 1.5;
        }
    </style>
